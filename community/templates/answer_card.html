<article data-answer-card class="rounded-2xl border-2 border-ink p-5 {% if is_top %}bg-brand-tint{% else %}bg-white{% endif %}">
  <div class="flex gap-4">

    <!-- vote box -->
    <div class="flex w-[64px] shrink-0 flex-col items-center self-start rounded-xl border-2 border-ink bg-brand-tint px-2 py-3 text-center">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
      <span data-count class="text-sm font-extrabold">{{ answer.voters.count|default:0 }}</span>
      <span class="text-xs text-ink-soft">votes</span>
    </div>

    <div class="min-w-0 flex-1">
      <!-- author row -->
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <span class="card-avatar card-avatar-lilac">{{ answer.author.username|slice:":2"|upper }}</span>
        <span class="font-semibold">{{ answer.author.get_full_name|default:answer.author.username }}</span>
        <span class="text-ink-soft">· {{ answer.created_at|timesince }} ago</span>
        {% if is_top %}
        <span class="rounded-full border-2 border-ink bg-green-200 px-3 py-0.5 text-xs font-extrabold uppercase tracking-wider text-green-900">Top answer</span>
        {% endif %}
      </div>

      <!-- body -->
      <p class="mt-2 whitespace-pre-line text-[15px] leading-relaxed">{{ answer.body }}</p>

      <!-- helpful button -->
        <button type="button"
            data-vote-url="{% url 'community:vote_answer_ajax' answer.id %}"
            aria-pressed="{% if answer.user_has_voted %}true{% else %}false{% endif %}"
            class="mt-3 inline-flex items-center gap-2 text-sm font-bold hover:text-brand aria-pressed:text-brand [&[aria-pressed=true]_svg]:fill-current">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
            </svg>
            Helpful
        </button>
    </div>

  </div>
</article>
