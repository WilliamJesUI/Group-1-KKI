{# "Delete event" confirm pop-up from Figma. Opened by the button with popovertarget="delete-event-modal". #}
<div id="delete-event-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-event-title"
     class="m-auto w-[420px] max-w-[calc(100%-2rem)] rounded-[20px] border-2 border-ink bg-surface p-6 text-ink opacity-0 translate-y-2 transition-all transition-discrete duration-250 ease-out backdrop:bg-ink/90 open:opacity-100 open:translate-y-0 starting:open:opacity-0 starting:open:translate-y-2 motion-reduce:translate-y-0">
    <div class="flex flex-col gap-4">
        <h2 id="delete-event-title" class="font-display text-2xl leading-[1.25]">Delete "{{ event.name }}"?</h2>
        <p class="text-sm text-ink-soft">This can't be undone. Everyone who RSVP'd will lose it from their list.</p>
        <div class="flex justify-end gap-3">
            <button type="button" popovertarget="delete-event-modal" popovertargetaction="hide" class="rounded-full border-2 border-ink bg-surface px-6 py-3 text-[15px] font-extrabold hover:bg-brand-tint">Cancel</button>
            <form method="post" action="{% url 'events:delete_event' event.id %}">
                {% csrf_token %}
                <button type="submit" class="rounded-full border-2 border-ink bg-danger px-6 py-3 text-[15px] font-extrabold text-white hover:bg-danger-hover">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
