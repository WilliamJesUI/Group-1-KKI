{% load static %}
<div id="host-event-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="host-event-title"
     class="m-auto max-h-[calc(100dvh-2rem)] w-[560px] max-w-[calc(100%-2rem)] overflow-y-auto rounded-[20px] border-2 border-ink bg-surface p-6 text-ink opacity-0 translate-y-2 transition-all transition-discrete duration-250 ease-out backdrop:bg-ink/90 open:opacity-100 open:translate-y-0 starting:open:opacity-0 starting:open:translate-y-2 motion-reduce:translate-y-0">
    <form id="host-event-form" method="post" action="{% url 'events:create_event_ajax' %}" novalidate class="flex flex-col gap-4">
        {% csrf_token %}
        <h2 id="host-event-title" class="font-display text-2xl leading-[1.25]">Host an event</h2>

        <div class="flex flex-col gap-2">
            <label for="{{ form.name.id_for_label }}" class="text-[13px] font-extrabold">{{ form.name.label }}</label>
            {{ form.name }}
            <p data-error-for="name" class="hidden text-xs text-danger-text"></p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="{{ form.date.id_for_label }}" class="text-[13px] font-extrabold">Date &amp; time</label>
            <div class="flex flex-col gap-3 sm:flex-row">
                <div class="flex h-11 flex-1 items-center gap-2 rounded-full border-2 border-ink bg-surface px-4 focus-within:border-brand focus-within:ring-1 focus-within:ring-brand has-aria-invalid:border-danger">
                    <img src="{% static 'img/icons/calendar.svg' %}" alt="" width="18" height="18">
                    {{ form.date }}
                </div>
                <div class="flex h-11 flex-1 items-center gap-2 rounded-full border-2 border-ink bg-surface px-4 text-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand has-aria-invalid:border-danger">
                    <img src="{% static 'img/icons/clock.svg' %}" alt="" width="18" height="18">
                    {{ form.start }}
                    <span>-</span>
                    {{ form.end }}
                    <span>WIB</span>
                </div>
            </div>
            <p data-error-for="date" class="hidden text-xs text-danger-text"></p>
            <p data-error-for="start" class="hidden text-xs text-danger-text"></p>
            <p data-error-for="end" class="hidden text-xs text-danger-text"></p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="{{ form.location.id_for_label }}" class="text-[13px] font-extrabold">{{ form.location.label }}</label>
            {{ form.location }}
            <p data-error-for="location" class="hidden text-xs text-danger-text"></p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="{{ form.description.id_for_label }}" class="text-[13px] font-extrabold">{{ form.description.label }}</label>
            {{ form.description }}
            <p data-error-for="description" class="hidden text-xs text-danger-text"></p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="{{ form.what_to_bring.id_for_label }}" class="text-[13px] font-extrabold">{{ form.what_to_bring.label }} <span class="font-normal text-ink-soft">(optional)</span></label>
            {{ form.what_to_bring }}
            <p class="text-xs text-ink-soft">One item per line.</p>
            <p data-error-for="what_to_bring" class="hidden text-xs text-danger-text"></p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="{{ form.cover_photo_url.id_for_label }}" class="text-[13px] font-extrabold">{{ form.cover_photo_url.label }} <span class="font-normal text-ink-soft">(optional)</span></label>
            {{ form.cover_photo_url }}
            <p class="text-xs text-ink-soft">Paste a link to a photo, for example from Pexels.</p>
            <p data-error-for="cover_photo_url" class="hidden text-xs text-danger-text"></p>
        </div>

        <p data-error-for="__all__" class="hidden text-xs text-danger-text"></p>

        <div class="flex justify-end gap-3">
            <button type="button" popovertarget="host-event-modal" popovertargetaction="hide" class="rounded-full border-2 border-ink bg-surface px-6 py-3 text-[15px] font-extrabold hover:bg-brand-tint">Cancel</button>
            <button type="submit" class="rounded-full border-2 border-ink bg-brand px-6 py-3 text-[15px] font-extrabold text-white hover:bg-brand-hover disabled:opacity-40">Publish event</button>
        </div>
    </form>
</div>
<script src="{% static 'js/event_form.js' %}"></script>
