{% load static accounts_tags %}

<!-- Reusable component for a single comment -->
<div id="comment-{{ comment.id }}" data-comment>

    <!-- Link to the comment author's profile -->
    {% url 'profile:show_user_profile' comment.author.username as author_url %}

    <a href="{{ author_url }}" tabindex="-1" aria-hidden="true">
        {% avatar comment.author "sm" %}
    </a>

    <div>

        <p>
            <a href="{{ author_url }}">
                {{ comment.author.get_full_name|default:comment.author.username }}
            </a>

            · {{ comment.age_label }}
        </p>

        <!-- Display the comment text -->
        <p class="whitespace-pre-line text-sm">
            {{ comment.text }}
        </p>

    </div>


    <!-- Only authorized users can delete comments -->
    {% if comment.can_delete %}

        <button
            type="button"
            data-delete-comment="{% url 'garden:delete_comment' comment.id %}"
            aria-label="Delete comment">

            <img
                src="{% static 'img/icons/trash-danger.svg' %}"
                alt=""
                width="16"
                height="16">

        </button>

    {% endif %}

</div>
