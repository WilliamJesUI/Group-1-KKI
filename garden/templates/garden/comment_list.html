<!-- Render every comment returned by the view -->
{% for comment in comments %}

    {% include "garden/comment.html" %}

{% empty %}

    <!-- Displayed when there are no comments -->
    <p data-no-comments>
        No comments yet. Be the first to say something nice.
    </p>

{% endfor %}


<!-- Show a button when some comments are hidden -->
{% if hidden_count %}

    <button
        type="button"
        data-show-all-comments="{% url 'garden:show_comments' post.id %}?all=1">

        Show all {{ hidden_count|add:3 }} comments

    </button>

{% endif %}
