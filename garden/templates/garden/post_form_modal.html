{% load static %}

{% comment %}
This modal is used for both creating and editing posts.
JavaScript changes the title, button and form action.
{% endcomment %}

<div
    id="post-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="post-modal-title"
    class="m-auto max-h-[calc(100dvh-2rem)] w-[560px] max-w-[calc(100%-2rem)] overflow-y-auto rounded-[20px] border-2 border-ink bg-surface p-6 text-ink">

    <form
        id="post-form"
        method="post"
        action="{% url 'garden:create_post' %}"
        data-create-url="{% url 'garden:create_post' %}"
        novalidate
        class="flex flex-col gap-4">

        {% csrf_token %}

        <h2 id="post-modal-title">
            Share your garden
        </h2>

        <!-- Hidden field used to remove an existing photo -->
        {{ form.remove_photo }}


        <!-- Caption field -->
        <div class="flex flex-col gap-2">

            <label for="{{ form.caption.id_for_label }}">
                {{ form.caption.label }}
            </label>

            {{ form.caption }}

            <p data-error-for="caption" class="hidden text-xs text-danger-text"></p>

        </div>


        <!-- Photo upload field -->
        <div class="flex flex-col gap-2">

            <span>
                Photo (optional)
            </span>

            {{ form.photo_upload }}

            <!-- Drag and drop area -->
            <label
                id="photo-drop"
                for="{{ form.photo_upload.id_for_label }}"
                class="flex h-[160px] cursor-pointer flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-ink">

                <img
                    src="{% static 'img/icons/upload.svg' %}"
                    alt=""
                    width="24"
                    height="24">

                <span id="photo-drop-text">
                    Drop a photo or browse
                </span>

                <span class="text-xs">
                    JPG, PNG or WebP, up to 2 MB
                </span>

            </label>


            <!-- Image preview -->
            <div
                id="photo-preview"
                class="hidden flex-col gap-2">

                <img
                    id="photo-preview-img"
                    src=""
                    alt="Preview of the chosen photo">

                <div class="flex items-center justify-between gap-3 text-xs">

                    <span id="photo-file-name"></span>

                    <label for="{{ form.photo_upload.id_for_label }}">
                        Replace
                    </label>

                    <button
                        type="button"
                        id="photo-remove">
                        Remove
                    </button>

                </div>

            </div>

            <p data-error-for="photo_upload" class="hidden text-xs text-danger-text"></p>

        </div>


        <!-- Plant selection -->
        <div class="flex flex-col gap-2">

            <label for="{{ form.plant.id_for_label }}">
                {{ form.plant.label }}
            </label>

            {{ form.plant }}

            <p data-error-for="plant" class="hidden text-xs text-danger-text"></p>

        </div>


        <p data-error-for="__all__" class="hidden text-xs text-danger-text"></p>


        <!-- Modal actions -->
        <div class="flex justify-end gap-3">

            <button
                type="button"
                popovertarget="post-modal"
                popovertargetaction="hide">
                Cancel
            </button>

            <button
                type="submit"
                id="post-submit">
                Post
            </button>

        </div>

    </form>

</div>
