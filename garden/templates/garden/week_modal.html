{% comment %}
Moderator-only modal for selecting the Plant of the Week.
{% endcomment %}

<div
    id="week-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="week-modal-title">

    <form
        id="week-form"
        method="post"
        action="{% url 'garden:set_plant_of_the_week' %}"
        novalidate>

        {% csrf_token %}

        <h2 id="week-modal-title">
            Plant of the week
        </h2>


        <!-- Plant selector -->
        <div class="flex flex-col gap-2">

            <label for="{{ week_form.plant.id_for_label }}">
                {{ week_form.plant.label }}
            </label>

            {{ week_form.plant }}

            <p data-error-for="plant" class="hidden"></p>

        </div>


        <!-- Optional description -->
        <div class="flex flex-col gap-2">

            <label for="{{ week_form.short_line.id_for_label }}">
                Short line (optional)
            </label>

            {{ week_form.short_line }}

            <p>
                Shown under the plant name on the Garden page.
            </p>

            <p data-error-for="short_line" class="hidden"></p>

        </div>


        <p data-error-for="__all__" class="hidden"></p>


        <!-- Save or cancel -->
        <div class="flex justify-end gap-3">

            <button
                type="button"
                popovertarget="week-modal"
                popovertargetaction="hide">
                Cancel
            </button>

            <button type="submit">
                Save plant
            </button>

        </div>

    </form>

</div>
