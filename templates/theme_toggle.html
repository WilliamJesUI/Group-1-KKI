{# Light/dark switch. static/js/theme.js does the switching and remembers the choice in this browser. #}
<button type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch light or dark mode"
        class="grid size-10 shrink-0 place-items-center rounded-full border-2 border-ink bg-surface text-ink transition duration-150 ease-out hover:bg-brand-tint active:scale-[0.95] motion-reduce:active:scale-100">
    <svg data-theme-icon="moon" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg data-theme-icon="sun" viewBox="0 0 24 24" class="hidden size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
